name: conformance

# The claim this repository makes is that two programs behave alike.
# Running the comparison on a machine nobody here set up is the only
# way to show that the claim does not depend on one person's laptop.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  compare:
    # Deliberately the floating label: a run on whatever the hosted
    # image happens to be is the point. Two consequences to know about -
    # the label moves to Ubuntu 26 on 2026-10-19, and actions/checkout@v4
    # still declares Node 20, which the runners now force to Node 24.
    # Both are warnings today and could become failures; a red run here
    # is about this file, not about the two programs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Versions
        run: |
          bash --version | head -1
          python3 --version
          tmux -V

      - name: Compare the two implementations
        run: tests/conformance/run.sh
